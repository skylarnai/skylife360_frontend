<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Sky Claims Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: navy top bar, role-specific nav, wide work column + narrow rail (API / activity) that stacks on phones */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --soft:#F7FAFC; --tint:#EEF4F8; --line:#D6DFE7; --line2:#E3EAF0;
  --fg:#13253A; --muted:#5A6B7D; --accent:#1C84B0; --accent-ink:#16698D; --amber:#D98A1C;
  --hdr:#0F2A44; --hdr-fg:#FFFFFF; --btn:#0F2A44; --btn-fg:#FFFFFF; --code-bg:#0F2A44; --code-fg:#DCE8F2;
  --ok-bg:#E1F3EA; --ok:#17663F; --amb-bg:#FCEFDB; --amb:#8A520C; --red-bg:#FBE7E5; --red:#9A2C26;
  --teal-bg:#E2F0F7; --teal:#16698D; --grey-bg:#EEF1F4; --grey:#5A6B7D; --plum-bg:#F6E6EC; --plum:#6E2D46;
  --mark:#FFE7A8;
  --f-display:Archivo, Arial, sans-serif; --f-body:'Source Sans 3','Segoe UI',Arial,sans-serif; --f-mono:'JetBrains Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1622; --surface:#122130; --soft:#15283A; --tint:#173045; --line:#26405A; --line2:#1F3549;
  --fg:#E3ECF4; --muted:#97AABD; --accent:#4FB0DA; --accent-ink:#7CC6E6; --amber:#E39B33;
  --hdr:#08131F; --hdr-fg:#FFFFFF; --btn:#2A5C86; --btn-fg:#FFFFFF; --code-bg:#07111C; --code-fg:#CFE0EE;
  --ok-bg:#123526; --ok:#7FD3A6; --amb-bg:#3A2A12; --amb:#F0B865; --red-bg:#3B1A18; --red:#F19A92;
  --teal-bg:#10303F; --teal:#7CC6E6; --grey-bg:#1E2C3A; --grey:#9FB0C0; --plum-bg:#3A1C29; --plum:#E7A9C1;
  --mark:#5A4A16; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#122130; --soft:#15283A; --tint:#173045; --line:#26405A; --line2:#1F3549;
  --fg:#E3ECF4; --muted:#97AABD; --accent:#4FB0DA; --accent-ink:#7CC6E6; --amber:#E39B33;
  --hdr:#08131F; --hdr-fg:#FFFFFF; --btn:#2A5C86; --btn-fg:#FFFFFF; --code-bg:#07111C; --code-fg:#CFE0EE;
  --ok-bg:#123526; --ok:#7FD3A6; --amb-bg:#3A2A12; --amb:#F0B865; --red-bg:#3B1A18; --red:#F19A92;
  --teal-bg:#10303F; --teal:#7CC6E6; --grey-bg:#1E2C3A; --grey:#9FB0C0; --plum-bg:#3A1C29; --plum:#E7A9C1;
  --mark:#5A4A16; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,.mono{font-family:var(--f-mono)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-fg)}
.hdr .wrap{padding-block:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 16px/1.15 var(--f-display)}
.brand small{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;opacity:.75}
.hosp{font:800 22px/1.1 var(--f-display);padding-left:18px;border-left:1px solid rgba(255,255,255,.22)}
.hosp small{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;opacity:.75;text-transform:uppercase}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font:500 12.5px var(--f-mono)}
.role-tag{font:700 10.5px var(--f-mono);letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--amber);color:#13253A}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 12px;min-height:36px}
.tabs{background:var(--hdr);border-top:1px solid rgba(255,255,255,.12)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{background:transparent;border:0;color:#fff;opacity:.75;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{opacity:1;border-bottom-color:var(--amber)}
.tab .tg{font:700 9.5px var(--f-mono);margin-left:6px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.15)}

/* building blocks */
main.wrap{padding-block:16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px 18px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.cols{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.cols>.main{flex:999 1 640px;min-width:0}
.cols>.rail{flex:1 1 340px;min-width:0;display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
.tile .v{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.chip{font:700 11px var(--f-mono);letter-spacing:.03em;padding:2px 7px;border-radius:4px;white-space:nowrap;display:inline-block}
.ok{background:var(--ok-bg);color:var(--ok)} .amb{background:var(--amb-bg);color:var(--amb)} .red{background:var(--red-bg);color:var(--red)}
.teal{background:var(--teal-bg);color:var(--teal)} .grey{background:var(--grey-bg);color:var(--grey)}
.pillc{font:600 12px var(--f-body);padding:4px 10px;border-radius:99px;display:inline-block}
.btn{border-radius:6px;padding:10px 16px;font-weight:700;min-height:44px;border:1px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{background:var(--amber);color:#13253A;border-color:var(--amber)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.note{border:1px dashed var(--amber);background:var(--amb-bg);border-radius:8px;padding:9px 12px;font-size:14px}
.note.live{border-color:var(--ok);background:var(--ok-bg)}
.note.plum{border:1px solid var(--plum);background:var(--plum-bg);color:var(--plum)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--fg);min-height:40px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--tint);text-align:left;padding:8px 10px;font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)} tr.sel td{background:var(--tint)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cite{font:600 12.5px var(--f-mono);color:var(--teal);background:var(--teal-bg);border-radius:3px;padding:0 3px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font:500 12px/1.55 var(--f-mono);overflow-x:auto;white-space:pre}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.kv span{color:var(--muted)}
.railhd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list{list-style:none;margin:0;padding:8px;display:grid;gap:6px}
.list li{border:1px solid var(--line);border-radius:6px;padding:7px 9px;display:grid;gap:2px;min-width:0}
.meth{font:700 10.5px var(--f-mono);background:var(--btn);color:#fff;border-radius:4px;padding:2px 6px}
.act{list-style:none;margin:0;padding:6px 12px 10px;display:grid}
.act li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.act time{font:500 12px var(--f-mono);color:var(--teal)}
.qbtn{border-radius:99px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.qbtn[aria-pressed="true"]{background:var(--btn);color:#fff;border-color:var(--btn)}

/* stage nav */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.stg{text-align:left;padding:8px 10px;border-radius:6px;min-height:52px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.stg.planned{border-style:dashed}
.stg.done{border-color:var(--accent)}
.stg b{font:700 13.5px var(--f-display);color:var(--fg)}
.stg.done b{color:var(--accent-ink)}
.stg[aria-current="step"]{background:var(--accent);border-color:var(--accent);border-style:solid;color:#fff}
.stg[aria-current="step"] b{color:#fff}
.stg .t{font:700 9.5px var(--f-mono);padding:1px 5px;border-radius:3px}
.stg[aria-current="step"] .t{background:rgba(255,255,255,.2);color:#fff}
.stg span.sub{display:block;font-size:12.5px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:48px;box-sizing:border-box}
.lshell{width:100%;max-width:1080px;display:grid;gap:20px}
.lbox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);width:100%;overflow:hidden;border-radius:16px;box-shadow:0 24px 60px -28px rgba(15,42,68,.38);animation:lrise .5s ease both}
@keyframes lrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lbox{animation:none}}
.lside{position:relative;overflow:hidden;background:var(--hdr);color:#fff;padding:52px 48px;display:flex;flex-direction:column;gap:40px;justify-content:space-between}
.lside::before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(93,182,221,.22);box-shadow:0 0 0 54px rgba(93,182,221,.05),0 0 0 108px rgba(93,182,221,.035);pointer-events:none}
.lside::after{content:"";position:absolute;left:-90px;bottom:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(217,138,28,.22),transparent 68%);pointer-events:none}
.lside>*{position:relative;z-index:1}
.lside .brand b{font-size:18px}
.lhero{display:grid;gap:16px}
.lhero .lbl{color:rgba(255,255,255,.62)}
.lside h1{font:800 38px/1.1 var(--f-display);letter-spacing:-.01em}
.lside .lead{margin:0;font-size:16px;line-height:1.65;color:rgba(255,255,255,.8);max-width:36ch}
.lfeat{margin:0;padding:0;list-style:none;display:grid;gap:22px}
.lfeat li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start}
.lfeat .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#5DB6DD}
.lfeat b{display:block;font:700 12px var(--f-mono);letter-spacing:.08em;color:var(--amber);margin-bottom:4px}
.lfeat span{display:block;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.78)}
.lnote{font-size:13px;color:rgba(255,255,255,.58);line-height:1.5}
.lform{padding:56px 56px 48px;display:grid;gap:26px;align-content:center;background:var(--surface)}
.lhead{display:grid;gap:10px}
.lhead h2{font:800 30px/1.15 var(--f-display);letter-spacing:-.01em}
.lhead p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6;max-width:46ch}
.lgroup{display:grid;gap:12px}
.lgroup>.lbl{font-size:11.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:0;border-radius:0;overflow:visible}
.seg button{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:18px 18px 18px 52px;min-height:88px;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s}
.seg button:hover{border-color:var(--accent);background:var(--soft)}
.seg button b{display:block;font:700 15.5px var(--f-display);margin-bottom:4px}
.seg button small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.seg button::before{content:"";position:absolute;left:18px;top:20px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-sizing:border-box;transition:all .15s}
.seg button[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);box-shadow:0 0 0 3px var(--teal-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.seg button[aria-pressed="true"]::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,var(--surface) 5px)}
.lfields{display:grid;gap:20px}
.lfield{display:grid;gap:8px;font-size:13.5px;font-weight:600;color:var(--fg)}
.lfield .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.lfield .inp{position:relative;display:block}
.lfield input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;min-height:50px;background:var(--surface);color:var(--fg);font-size:15.5px;font-weight:400;transition:border-color .15s,box-shadow .15s}
.lfield input:hover{border-color:var(--muted)}
.lfield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.lfield .inp.pw input{padding-right:72px}
.lfield .show{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent-ink);font:600 13px var(--f-body);padding:8px 12px;border-radius:6px;min-height:36px}
.lfield .show:hover{background:var(--tint)}
.err{display:flex;gap:10px;align-items:flex-start;background:var(--red-bg);color:var(--red);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.5}
.err svg{flex:none;margin-top:2px}
.lgo{width:100%;min-height:54px;font-size:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,transform .1s}
.lgo:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.lgo:active{transform:translateY(1px)}
.ldemo{border:1.5px dashed var(--line);border-radius:12px;padding:18px 20px;background:var(--soft);display:grid;gap:12px}
.ldemo .top{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:baseline}
.ldemo .top span:last-child{font-size:12.5px;color:var(--muted)}
.dacc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:48px;transition:border-color .15s}
.dacc:hover{border-color:var(--accent)}
.dacc code{font-size:13px;overflow-wrap:anywhere}
.dacc em{font-style:normal;font-size:12.5px;color:var(--muted)}
.dacc .chip{justify-self:end}
.lfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;font-size:12.5px;line-height:1.55;color:var(--muted);padding-inline:6px}
.lfoot code{font-size:12px}
@media (max-width:900px){
  .lbox{grid-template-columns:1fr}
  .lside{padding:36px 32px;gap:28px}
  .lside h1{font-size:32px}
  .lform{padding:36px 32px}
}
@media (max-width:560px){
  .login{padding-block:20px}
  .lside{padding:28px 22px}
  .lform{padding:28px 22px;gap:22px}
  .seg{grid-template-columns:1fr}
  .lhead h2{font-size:26px}
}
.err{border-radius:10px}
.snip{font-size:13.5px;line-height:1.55;border-left:3px solid var(--line);padding-left:10px}
.task{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.task.doneT{opacity:.65}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:8px;padding-bottom:12px}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 3px var(--teal-bg)}
.tl time{font:500 12px var(--f-mono);color:var(--muted);padding-top:2px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:12.5px;color:var(--muted);margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
.hbtn[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:var(--amber)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.flow div{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;display:grid;gap:2px}
.flow div.on{border-color:var(--ok);background:var(--ok-bg)}
.flow div.cur{border-color:var(--accent);background:var(--tint)}
</style>

/* ================= DOCTOR · PROCESSED FILES ================= */
function fileMatches(f, q){
  if (!q) return { ok:true, hits:[] };
  const ql = q.toLowerCase();
  const p = PATIENTS[f.pt];
  const meta = [f.name, f.pt, f.cls, p.proc, p.dx].join(' ').toLowerCase();
  const hits = f.txt.filter(c => (c[1] + ' ' + c[2]).toLowerCase().includes(ql));
  return { ok: meta.includes(ql) || hits.length > 0, hits };
}
function hl(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function filteredFiles(){
  const f = S.fq;
  return FILES.map(x => Object.assign({ m: fileMatches(x, f.q.trim()) }, x))
    .filter(x => x.m.ok && (f.cls === 'all' || x.cls === f.cls) && (f.status === 'all' || x.status === f.status) && (f.pt === 'all' || x.pt === f.pt));
}
function fileResults(){
  const list = filteredFiles(), q = S.fq.q.trim();
  if (!list.length) return '<div style="border:1px dashed var(--line);border-radius:8px;padding:16px" class="muted">No documents match. Clear a filter or try a shorter search.</div>';
  return '<div class="small muted">Showing ' + list.length + ' of ' + FILES.length + ' documents</div><div class="tblw"><table style="min-width:720px"><thead><tr><th>DOCUMENT</th><th>PATIENT</th><th>TYPE</th><th>STATUS</th><th class="num">PAGES</th><th>UPLOADED</th></tr></thead><tbody>' +
    list.map(x => '<tr class="click' + (S.fq.sel === x.id ? ' sel' : '') + '" data-a="pickFile" data-v="' + x.id + '" tabindex="0"><td><b style="font-weight:600;overflow-wrap:anywhere">' + hl(x.name, q) + '</b>' +
      (x.m.hits.length ? '<div class="small muted" style="margin-top:2px">Page ' + x.m.hits[0][0] + ' · ' + esc(x.m.hits[0][1]) + ': “' + hl(x.m.hits[0][2], q) + '”</div>' : '') + '</td>' +
      '<td class="mono" style="font-size:12.5px">' + hl(x.pt, q) + '</td><td><span class="chip teal">' + esc(docType(x.cls)).toUpperCase() + '</span></td><td>' + statusChip(x.status) + '</td><td class="num small">' + x.pages + (x.ocr ? ' · scanned' : '') + '</td><td class="small muted" style="white-space:nowrap">' + x.up + '</td></tr>').join('') +

/* ================= DOCTOR · ASK ================= */
const ASKQ = {
  'SYN-P-1042': [0,1,2],
  'SYN-P-1077': [{ text:'What did the angiography show?', found:true, segs:[['Proximal LAD had a 95% thrombotic occlusion, treated with one drug-eluting stent (3.0 x 28 mm) with TIMI III flow afterwards ',0],['[1]',1],['.',0]], cites:[[1,'angiography_report.pdf',1,95,0]] },
                  { text:'What was the troponin level?', found:true, segs:[['hs-Troponin I was 4,820 ng/L against a reference below 26 ng/L ',0],['[1]',1],['.',0]], cites:[[1,'troponin_lab.pdf',1,97,0]] }],
  'SYN-P-1103': [{ text:'What anaesthesia was used for the LSCS?', found:true, segs:[['Elective repeat LSCS was done under spinal anaesthesia ',0],['[1]',1],['.',0]], cites:[[1,'lscs_operation_note.pdf',1,93,0]] }],
  'SYN-P-1120': [{ text:'What IOL power was planned?', found:true, segs:[['The right eye IOL power was +21.5 D (SRK/T), axial length 23.41 mm ',0],['[1]',1],['.',0]], cites:[[1,'a_scan_biometry.pdf',1,96,0]] }],
};
const askList = (pt) => ASKQ[pt].map(q => typeof q === 'number' ? QS[q] : q);
function freeSearch(pt, q){
  const words = q.toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const out = [];
  FILES.filter(f => f.pt === pt).forEach(f => f.txt.forEach(c => {
    const t = (c[1] + ' ' + c[2]).toLowerCase();
    const score = words.filter(w => t.includes(w)).length;
    if (score) out.push({ f:f.name, p:c[0], h:c[1], t:c[2], score });
  }));
  return out.sort((a,b) => b.score - a.score).slice(0, 5);
}
function viewAsk(){
  const a = S.ask, qs = askList(a.pt);
  let res = '';
  if (a.qi >= 0) res = answerBlock(qs[a.qi]);
  else if (a.freeRes) res = (S.dev ? '<div class="note small">Demo: shows the matching passages. Wire this form to <code>POST /api/v1/rag/ask</code> to get the written answer.</div>' : '') +
    (a.freeRes.length ? '<div class="lbl">Related passages</div>' + a.freeRes.map((r,i) => '<div class="snip"><div class="small muted">[' + (i+1) + '] ' + esc(r.f) + ' · page ' + r.p + ' · ' + esc(r.h) + '</div>' + esc(r.t) + '</div>').join('') : '<div style="background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:14px 16px">The uploaded documents do not contain this information.</div>');
  const p = PATIENTS[a.pt];
  return '<div class="cols"><section class="card main pad stack"><div class="between"><h2 style="font-size:18px">Ask about a patient</h2></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"><label class="field">Patient<select id="aPt">' + Object.keys(PATIENTS).map(k => '<option value="' + k + '"' + (k === a.pt ? ' selected' : '') + '>' + k + ' · ' + esc(PATIENTS[k].proc) + '</option>').join('') + '</select></label></div>' +
    '<div class="small muted">' + esc(p.dx) + ' · ' + esc(p.doctor) + '. Answers use only this patient’s documents and show where each fact came from.</div>' +
    '<div class="row" style="gap:6px">' + qs.map((q,i) => '<button class="qbtn" data-a="askQ" data-v="' + i + '" aria-pressed="' + (a.qi === i) + '">' + esc(q.text) + '</button>').join('') + '</div>' +
    '<form id="freeForm" class="row" style="flex-wrap:nowrap"><input id="aFree" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;background:var(--surface)" placeholder="Type a question, e.g. Was the histopathology report received?" value="' + esc(a.free) + '"><button class="btn pri" type="submit">Ask</button></form>' +
    res + '</section><aside class="rail">' +
    apiRail('ask', [['POST','/api/v1/rag/ask','READY','Answer with sources · filters.user_id = patient · stream=true for SSE'],['POST','/api/v1/rag/search','READY','Ranked passages only'],['POST','/api/v1/evaluation/evaluate','READY','Answer check: grounded, relevance, safety']],
      'POST /api/v1/rag/ask\n{ "query": "…",\n  "filters": { "user_id": "' + a.pt + '" },\n  "stream": false }') + activityRail() + '</aside></div>';
}

/* ================= DOCTOR · PATIENTS ================= */
const TL = {
  'SYN-P-1042': [['04 Oct','OPD consultation','Symptomatic cholelithiasis, surgery advised','opd_consultation.pdf'],['05 Oct','USG abdomen','Multiple calculi, largest 14 mm','usg_abdomen.pdf'],['08 Oct','Admitted','Planned admission','opd_consultation.pdf'],['09 Oct','Surgery','Laparoscopic cholecystectomy under GA','operation_note.pdf'],['11 Oct','Discharged','Uneventful recovery; histopathology awaited','discharge_summary.pdf']],
  'SYN-P-1077': [['26 Oct','Admitted via ER','Chest pain 2 h; STEMI on ECG','admission_note.pdf'],['26 Oct','Troponin','hs-TnI 4,820 ng/L','troponin_lab.pdf'],['27 Oct','Cath lab','PTCA, one DES to proximal LAD','angiography_report.pdf']],
  'SYN-P-1103': [['24 Oct','Admitted','38 weeks, previous LSCS','antenatal_card.jpg'],['24 Oct','Surgery','Elective repeat LSCS, spinal','lscs_operation_note.pdf'],['25 Oct','Lab','Hb 10.8 g/dL POD 1','cbc_report.pdf'],['27 Oct','Discharged','Mother and baby stable','discharge_summary.pdf']],
  'SYN-P-1120': [['20 Oct','Biometry','IOL +21.5 D','a_scan_biometry.pdf'],['20 Oct','Surgery','Phaco + foldable IOL, right eye','op_note.pdf'],['20 Oct','Consent','Scan couldn’t be read, re-scan needed','consent_form.jpg']],
};
function viewPatients(){
  const p = PATIENTS[S.pt], files = FILES.filter(f => f.pt === S.pt);
  return '<div class="cols"><section class="card main pad stack"><div class="between"><h2 style="font-size:18px">Patient summary</h2><label class="field" style="min-width:220px">Patient<select id="pPick">' + Object.keys(PATIENTS).map(k => '<option value="' + k + '"' + (k === S.pt ? ' selected' : '') + '>' + k + ' · ' + esc(PATIENTS[k].proc) + '</option>').join('') + '</select></label></div>' +
    '<div><div class="mono small" style="color:var(--accent)">' + S.pt + ' · ' + p.sex + ' · ' + p.age + '</div><h3 style="font-size:20px;margin:2px 0">' + esc(p.proc) + '</h3><div class="row muted small" style="gap:4px 16px"><span>' + esc(p.dx) + '</span><span>Treating doctor <b style="color:var(--fg)">' + esc(p.doctor) + '</b></span><span>Admitted ' + p.adm + ' · Discharged ' + p.dis + '</span><span>Claim ' + stageChip(p.stage) + '</span></div></div>' +
    '<div class="lbl">Timeline · from the patient’s documents</div><ol class="tl">' + TL[S.pt].map(t => '<li><time>' + t[0] + '</time><span class="dot"></span><div><b style="font-weight:600">' + esc(t[1]) + '</b> · ' + esc(t[2]) + '<div class="small" style="color:var(--teal)">Source: ' + esc(t[3]) + '</div></div></li>').join('') + '</ol>' +
    (S.dev ? '<div class="note small">API · NEEDED: <code>GET /api/v1/patients/{user_id}/timeline</code> (dates, events, codes, each with its source page). <code>POST /api/v1/claims/intake/extract</code> already pulls claim fields and can seed it.</div>' : '') +
    '</section><aside class="rail"><section class="card pad stack"><div class="lbl">Documents · ' + files.length + '</div>' +
    files.map(f => '<div class="between" style="border:1px solid var(--line);border-radius:6px;padding:7px 9px;align-items:center"><button class="link" style="text-align:left;overflow-wrap:anywhere" data-a="openFile" data-v="' + f.id + '">' + esc(f.name) + '</button>' + statusChip(f.status) + '</div>').join('') +
    '<div class="small muted">Claim amounts, payer details and integrity findings are not shown to doctors and staff.</div></section>' +
    apiRail('patient', [['GET','/api/v1/patients/{user_id}','NEEDED','Patient header: sex, age, diagnosis, doctor, dates'],['GET','/api/v1/patients/{user_id}/timeline','NEEDED','Timeline events with sources'],['GET','/api/v1/files?patient=','NEEDED','Documents list']]) + '</aside></div>';
}

/* ================= DOCTOR · TO-DOS ================= */
const TASKS = [
  ['t1','Signature needed','amb','Sign the anaesthesia record','SYN-P-1042 · SUV-261028-01','The anaesthetist signature is blank. The insurer returns surgical claims without it.','anaesthesia_record.jpg · page 1','Mark as signed'],
  ['t2','Insurer question','teal','Explain the 2-night stay','SYN-P-1042 · TPA SYN-3','The TPA asks why a day-care lap cholecystectomy needed 2 nights. A suggested reply based on the discharge summary is below.','discharge_summary.pdf · page 1','Send reply'],
  ['t3','Signature needed','amb','Sign the discharge summary','SYN-P-1103 · SUV-261026-02','The insurer needs a signed discharge summary with the final diagnosis and ICD-10 code before the claim can be sent.','discharge_summary.pdf · page 2','Mark as signed'],
  ['t4','Please confirm','teal','Confirm diagnosis and procedure','SYN-P-1077 · PM-JAY','The pre-auth request lists I21.0 and PTCA with 1 DES. Please confirm before it is sent.','angiography_report.pdf · page 1','Confirm'],
  ['t5','Re-scan needed','red','Consent form couldn’t be read','SYN-P-1120 · SUV-261025-05','The phone photo was too blurry to read. Re-scan the consent form and upload it again.','consent_form.jpg','Mark as re-scanned'],
];
function viewTasks(){
  const open = TASKS.filter(t => !S.tasks[t[0]]).length;
  return '<div class="cols"><section class="card main pad stack"><div class="between"><h2 style="font-size:18px">My to-dos</h2><span class="small muted">Requests from the claims team and insurers</span></div>' +
    '<div class="row" style="gap:6px"><span class="pillc amb">' + open + ' to do</span><span class="pillc ok">' + (TASKS.length - open) + ' done</span></div>' +
    TASKS.map(t => { const done = S.tasks[t[0]];
      return '<div class="task' + (done ? ' doneT' : '') + '"><div class="between"><div class="row" style="gap:8px"><span class="chip ' + (done ? 'ok' : t[2]) + '">' + (done ? 'DONE' : t[1].toUpperCase()) + '</span><b>' + esc(t[3]) + '</b></div><span class="mono small muted">' + esc(t[4]) + '</span></div>' +
        '<div class="small muted">' + esc(t[5]) + '</div><div class="small" style="color:var(--teal)">See: ' + esc(t[6]) + '</div>' +
        (t[0] === 't2' && !done ? '<div class="snip">The patient had post-operative nausea on day 1 and was kept for observation; discharged on day 2 after tolerating oral feeds <span class="cite">[discharge_summary.pdf, page 1]</span>.</div>' : '') +
        '<div class="row">' + (done ? '<span class="small" style="color:var(--ok)">Done by ' + esc(S.user.name) + ' at ' + done + '</span>' : '<button class="btn sm pri" data-a="task" data-v="' + t[0] + '">' + t[7] + '</button><button class="btn sm">Open document</button>') + '</div></div>'; }).join('') +
    '</section><aside class="rail">' + apiRail('to-dos', [['GET','/api/v1/claims/gap-reports/{gap_report_id}','READY','Gap report sent back to this user'],['POST','/api/v1/claims/gap-reports/{gap_report_id}/links','READY','Short-lived link to open the report'],['GET','/api/v1/claims/gaps/runs/{run_id}','READY','Gap findings with source pages'],['GET','/api/v1/tasks?assignee=me','NEEDED','To-do list: owner, status, due'],['POST','/api/v1/tasks/{task_id}/resolve','NEEDED','Mark done with a note'],['POST','/api/v1/rag/ask','READY','Draft an insurer reply from the documents']]) + activityRail() + '</aside></div>';
}

function doLogin(){
  const emailEl = $('#lEmail'), pwEl = $('#lPw'); if (!emailEl || !pwEl) return;
  const email = emailEl.value.trim().toLowerCase(), pw = pwEl.value, u = USERS[email];
  S.lEmail = email; S.lPw = pw;
  if (!email || !pw) { S.loginErr = 'Enter your work email and password to continue.'; render(); return; }
  if (!u || u.pw !== pw) { S.loginErr = 'That email and password don’t match a demo account. Tap one of the demo accounts below to fill it in.'; render(); return; }
  if (u.role !== S.loginRole) { S.loginErr = email + ' is a ' + (u.role === 'admin' ? 'Admin' : 'Doctor / Staff') + ' account. Pick that role above, or use a matching account.'; render(); return; }
  S.loginErr = ''; S.lEmail = ''; S.lPw = 'demo1234'; login(email); render(); window.scrollTo(0,0);
}
/* ================= render + events ================= */
function render(){
  if (!S.user) { $('#app').innerHTML = viewLogin(); return; }
  const V = { worklist:viewWorklist, desk:viewDesk, users:viewUsers, files:viewFiles, ask:viewAsk, patients:viewPatients, tasks:viewTasks };
  $('#app').innerHTML = shell((V[S.view] || V.files)());
}
const A = {
  loginRole: (v) => { S.loginRole = v; S.loginErr = ''; S.lEmail = ''; S.lPw = 'demo1234'; render(); },
  doLogin: () => doLogin(),
  fillDemo: (v) => { S.loginRole = USERS[v].role; S.lEmail = v; S.lPw = 'demo1234'; S.loginErr = ''; render(); const p = $('#lPw'); if (p) p.focus(); },
  togglePw: () => { const p = $('#lPw'), b = $('.lfield .show'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); },
  logout: () => { log('signed out'); S.user = null; try { sessionStorage.removeItem('skyclaims.user'); } catch(e) {} render(); },
  nav: (v) => { S.view = v; render(); window.scrollTo(0,0); },
  step: (v) => { S.desk.step = +v; render(); },
  upload: () => { S.desk.uploaded = true; log('uploaded batch: 7 ingested, 1 duplicate, 1 rejected'); render(); },
  retry: () => { S.desk.retried = true; log('anaesthesia_record.jpg read on the second try'); render(); },
  deskQ: (v) => { S.desk.q = +v; S.desk.asked = true; log('asked: ' + QS[+v].text); render(); },
  runGaps: () => { S.desk.gapsRun = true; log('ran the gap check: 3 to fix, claim packet built'); render(); },
  runIntegrity: () => { S.desk.integrityRun = true; log('ran the integrity check: 5 passed, 1 to check'); render(); },
  decide: () => {
    const d = S.desk, note = ($('#rationale') || {}).value || '';
    d.note = note.trim();
    if (!d.pick) { d.err = 'Choose a decision.'; render(); return; }
    if (d.pick !== 'APPROVED' && d.note.length < 10) { d.err = 'Add a short reason (at least 10 characters).'; render(); return; }
    d.err = ''; d.decision = d.pick;
    log(d.decision === 'REJECTED' ? 'sent the claim back to the hospital' : 'approved the claim' + (d.decision === 'FALSE_POSITIVE' ? ' (integrity warning marked false alarm)' : ''));
    render();
  },
  undoDecision: () => { Object.assign(S.desk, { decision:null, pick:null, err:'' }); render(); },
  submit: () => { S.desk.submitted = true; log('submitted the claim to TPA SYN-3'); render(); },
  resetDesk: () => { Object.assign(S.desk, { step:0, uploaded:false, retried:false, q:0, asked:false, gapsRun:false, integrityRun:false, decision:null, pick:null, note:'', err:'', submitted:false }); render(); },
  toggleDev: () => { S.dev = !S.dev; try { localStorage.setItem('skyclaims.dev', S.dev ? '1' : '0'); } catch(e) {} render(); },
  pickFile: (v) => { S.fq.sel = v; $('#fileResults').innerHTML = fileResults(); $('#fileDetail').innerHTML = fileDetail(); },
  quickSearch: (v) => { S.fq.q = v; S.fq.sel = null; render(); },
  openFile: (v) => { S.fq = { q:'', cls:'all', status:'all', pt:'all', sel:v }; S.view = 'files'; render(); },
  askAbout: (v) => { S.ask = { pt:v, qi:-1, free:'', freeRes:null }; S.view = 'ask'; render(); },
  askQ: (v) => { S.ask.qi = +v; S.ask.freeRes = null; log('asked about ' + S.ask.pt + ': ' + askList(S.ask.pt)[+v].text); render(); },
  reqRescan: (v) => { log('requested a re-scan of ' + FILES.find(f => f.id === v).name); render(); },
  task: (v) => { S.tasks[v] = now(); log('completed: ' + TASKS.find(t => t[0] === v)[3]); render(); },
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el.dataset.v); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.target.id === 'lEmail' || e.target.id === 'lPw')) { e.preventDefault(); doLogin(); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-a]')) { e.preventDefault(); A[e.target.dataset.a](e.target.dataset.v); } });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'loginForm') doLogin();
  if (e.target.id === 'freeForm') {
    const q = $('#aFree').value.trim(); if (!q) return;
    S.ask.free = q; S.ask.qi = -1; S.ask.freeRes = freeSearch(S.ask.pt, q); log('searched ' + S.ask.pt + ': ' + q); render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'fSearch') { S.fq.q = e.target.value; $('#fileResults').innerHTML = fileResults(); }
  if (e.target.id === 'rationale') S.desk.note = e.target.value;
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (e.target.name === 'dec') S.desk.pick = e.target.value;
  if (id === 'fPt' || id === 'fCls' || id === 'fStatus') { S.fq[{ fPt:'pt', fCls:'cls', fStatus:'status' }[id]] = e.target.value; $('#fileResults').innerHTML = fileResults(); }
  if (id === 'aPt') { S.ask = { pt:e.target.value, qi:-1, free:'', freeRes:null }; render(); }
  if (id === 'pPick') { S.pt = e.target.value; render(); }
});
render();
})();
</script>
